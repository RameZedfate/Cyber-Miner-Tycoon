<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HOWTRAVLE 便宜票雷達</title>
<meta name="description" content="台灣出發飛日本、韓國、泰國、越南的預估低價機票與精選便宜酒店，一鍵前往 Trip.com 訂購。" />
<meta name="theme-color" content="#0E2A47" />
<style>
  :root{
    --navy:#0E2A47; --blue:#2563EB; --blue-soft:#E8EFFE; --yellow:#FFC72C;
    --bg:#EEF1F6; --card:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
    --green:#0F7B4E; --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-text-size-adjust:100%}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  /* 頂部 */
  header{background:var(--navy);color:#fff;padding:18px 0 22px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{font-size:20px;margin:0;letter-spacing:.5px}
  .brand h1 b{color:var(--yellow)}
  .pill-box{margin-top:14px;background:#fff;color:var(--ink);border-radius:999px;padding:12px 20px}
  .pill-box .t{font-weight:700;font-size:17px}
  .pill-box .s{color:var(--muted);font-size:14px;margin-top:2px}

  /* 機票／酒店 切換 */
  .tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:5px;margin:16px 0 4px;
    box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 0;font-weight:700;font-size:15px;white-space:nowrap}
  .tabs button[aria-selected="true"]{background:var(--navy);color:#fff}

  h2.sec{font-size:26px;margin:22px 0 4px;line-height:1.25}
  .sub{color:#374151;font-size:15px;margin:0 0 14px}
  .note{color:var(--muted);font-size:12.5px;margin:6px 0 0}

  /* 橫向捲動列 */
  .scroller{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .scroller::-webkit-scrollbar{display:none}
  .month{flex:0 0 auto;min-width:92px;border:0;border-radius:16px;background:#DFE3EA;padding:12px 10px;text-align:center;
    scroll-snap-align:start}
  .month .m{font-size:18px;font-weight:700}
  .month .y{font-size:14px;margin-top:2px}
  .month .p{font-size:12px;margin-top:4px;color:var(--muted)}
  .month[aria-pressed="true"]{background:var(--blue);color:#fff}
  .month[aria-pressed="true"] .p{color:#DCE6FF}
  .chip{flex:0 0 auto;border:1.5px solid #C9CED8;background:#fff;border-radius:999px;padding:8px 18px;font-size:15px;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

  .row{display:flex;gap:10px;align-items:center;margin:10px 0 2px;flex-wrap:wrap}
  .seg{display:inline-flex;background:#DFE3EA;border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600}
  .seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  select{font:inherit;font-size:14px;border:1.5px solid #C9CED8;border-radius:999px;padding:7px 12px;background:#fff}

  .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:12px 2px 8px}
  .holiday-hint{background:#FFF7DB;border-radius:12px;padding:8px 12px;font-size:13px;color:#7A5600;margin:6px 0 8px}

  /* 卡片 */
  .card{background:var(--card);border-radius:var(--radius);margin:12px 0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card .body{padding:18px 20px 14px}
  .dest{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
  .dest .name{font-size:19px;font-weight:800}
  .dest .from{font-size:13px;color:var(--muted)}
  .leg{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;margin:10px 0}
  .leg svg{width:26px;height:26px;margin-top:2px}
  .leg .d{font-size:17px;font-weight:700}
  .leg .r{font-size:14px;color:var(--muted);margin-top:2px}
  .leg .x{font-size:15px;font-weight:700}
  .leg .x.stop{color:var(--muted);font-weight:600}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:8px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:#1E40AF;font-weight:600}
  .tag.hol{background:#FFF1C2;color:#7A5600}
  .price{text-align:right}
  .price .l{font-size:13px;color:var(--muted)}
  .price .v{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .price .n{font-size:13px;color:var(--muted)}
  .go{display:flex;justify-content:center;align-items:center;gap:8px;border-top:1px solid var(--line);
    padding:15px;font-weight:700;font-size:16px;text-decoration:none}
  .go span{text-decoration:underline;text-underline-offset:4px}
  .go:active{background:#F3F4F6}

  .pick{border:2px solid var(--yellow)}
  .pick .badge{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
  .pick .checked{font-size:12.5px;color:var(--green);margin-top:8px;font-weight:600}
  .pick .memo{font-size:14px;margin-top:6px;color:#374151}

  .hotel .name{font-size:18px;font-weight:800}
  .hotel .area{font-size:14px;color:var(--muted);margin-top:2px}
  .hotel .score{display:inline-block;background:var(--navy);color:#fff;font-weight:700;border-radius:8px;padding:2px 8px;font-size:14px;margin-right:6px}

  .more{display:block;width:100%;border:1.5px solid #C9CED8;background:#fff;border-radius:999px;padding:12px;font-weight:700;margin:6px 0 4px}
  .empty{background:#fff;border-radius:var(--radius);padding:26px 20px;text-align:center;color:var(--muted)}
  .empty a.btn{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:999px}

  footer{color:var(--muted);font-size:12.5px;line-height:1.7;padding:22px 0 40px}
  .hidden,#picks.off{display:none !important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>HOWTRAVLE <b>便宜票雷達</b></h1></div>
    <div class="pill-box" aria-hidden="true">
      <div class="t" id="scopeText">台灣出發 → 日本・韓國・泰國・越南</div>
      <div class="s" id="scopeSub">任何日期・1 位成人・每天自動更新</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="false" data-tab="fsc">🛫 傳統航空</button>
    <button role="tab" aria-selected="true" data-tab="flights">✈️ 便宜機票</button>
    <button role="tab" aria-selected="false" data-tab="hotels">🏨 便宜酒店</button>
  </div>

  <!-- ===================== 機票 ===================== -->
  <section id="flights">
    <div id="picks" class="hidden">
      <h2 class="sec">Adam 今日精選</h2>
      <p class="sub">已在 Trip.com 核對過當下價格</p>
      <div id="pickList"></div>
    </div>

    <h2 class="sec" id="fTitle">飛往日韓泰越的超值航班</h2>
    <p class="sub" id="fSub">預估最低價格</p>

    <div class="row">
      <div class="seg" id="tripType">
        <button aria-pressed="true" data-v="rt">來回</button>
        <button aria-pressed="false" data-v="ow">單程</button>
      </div>
      <select id="origin" aria-label="出發地">
        <option value="">全部出發地</option>
        <option value="TPE">台北出發</option>
        <option value="KHH">高雄出發</option>
        <option value="RMQ">台中出發</option>
      </select>
    </div>

    <div class="scroller" id="months" style="margin-top:10px"></div>
    <div class="scroller" id="countries"></div>
    <div class="scroller" id="filters"></div>

    <div id="holidayHint" class="holiday-hint hidden"></div>
    <div class="meta"><span id="updated">讀取中…</span><span id="count"></span></div>
    <div id="flightList"></div>
    <button class="more hidden" id="moreBtn">查看更多</button>
  </section>

  <!-- ===================== 酒店 ===================== -->
  <section id="hotels" class="hidden">
    <h2 class="sec">便宜又不踩雷的酒店</h2>
    <p class="sub">評分 8.0 以上・每晚含稅價</p>
    <div class="scroller" id="hCountries"></div>
    <div class="meta"><span id="hUpdated"></span><span id="hCount"></span></div>
    <div id="hotelList"></div>
  </section>

  <footer>
    機票價格為「預估最低價」，來自航班比價快取，每天自動更新；實際價格、座位與行李規定以 Trip.com 頁面為準。<br />
    本頁所有訂購連結都是 Trip.com 聯盟行銷連結，透過連結訂購，我會獲得少量回饋，你付的價格不變。謝謝支持 🙏<br />
    本站非 Trip.com 官方網站。
  </footer>
</main>

<script>
/* ====================================================================
   ① 設定區（日後要改的東西都在這裡）
   ==================================================================== */
const AFFILIATE = {
  allianceId: "7106961",   // Trip.com Allianceid
  sid:        "261258404", // Trip.com SID
  sub1:       "howtravle", // trip_sub1：網址加 ?src=ig_day9 會變成 howtravle_ig_day9，可分辨哪篇貼文帶來訂單
  sub3:       "D17991192", // trip_sub3：來自你的官方推廣連結
};
const CONFIG = {
  // 機票資料來源，依序嘗試。第一格貼新 Worker（deals/worker.js）的網址；第二格是舊版 Worker，當備援。
  dataUrls: ["https://howtravle-deals.a8225012.workers.dev/", "https://cold-union-5668.a8225012.workers.dev/"],
  fscUrl: "https://howtravle-deals.a8225012.workers.dev/?part=fsc", // 傳統航空
  picksUrl: "picks.json",   // Adam 今日精選（HOWTRAVLE 每日 Top 2）
  hotelsUrl: "hotels.json", // 精選酒店
  monthsAhead: 4,
  pageSize: 12,
};

// 台灣 3 天以上連假（依人事行政總處公告）。每年公告新日曆後在這裡補上。
const HOLIDAYS = [
  { name:"光復節連假",   start:"2026-10-24", end:"2026-10-26" },
  { name:"行憲紀念日連假", start:"2026-12-25", end:"2026-12-27" },
  { name:"元旦連假",     start:"2027-01-01", end:"2027-01-03" },
  { name:"春節連假",     start:"2027-02-04", end:"2027-02-10" },
  { name:"228 連假",     start:"2027-02-27", end:"2027-03-01" },
  { name:"清明兒童節連假", start:"2027-04-03", end:"2027-04-06" },
];

const COUNTRIES = { JP:"日本", KR:"韓國", TH:"泰國", VN:"越南", CN:"中國大陸", HK:"香港" };
const MAIN_COUNTRIES = ["JP","KR","TH","VN"];                 // 便宜機票
const FSC_COUNTRIES  = ["JP","KR","TH","VN","CN","HK"];       // 傳統航空
// 傳統航空名單（要增減就改這裡；worker.js 也有一份，新增時兩邊都加）
const FSC_AIRLINES = {
  CI:"中華航空", BR:"長榮航空", JX:"星宇航空", AE:"華信航空", B7:"立榮航空",
  JL:"日本航空", NH:"全日空", KE:"大韓航空", OZ:"韓亞航空",
  CX:"國泰航空", HX:"香港航空", NX:"澳門航空",
  TG:"泰國航空", VN:"越南航空", SQ:"新加坡航空", MH:"馬來西亞航空", PR:"菲律賓航空",
  CA:"中國國際航空", MU:"東方航空", CZ:"南方航空", FM:"上海航空", MF:"廈門航空",
  ZH:"深圳航空", "3U":"四川航空", HU:"海南航空", SC:"山東航空", HO:"吉祥航空",
};
const CITIES = {
  TYO:["東京","JP"], NRT:["東京","JP"], HND:["東京","JP"], OSA:["大阪","JP"], KIX:["大阪","JP"], ITM:["大阪","JP"],
  NGO:["名古屋","JP"], SPK:["札幌","JP"], CTS:["札幌","JP"], FUK:["福岡","JP"], OKA:["沖繩","JP"], SDJ:["仙台","JP"],
  HIJ:["廣島","JP"], KMJ:["熊本","JP"], KOJ:["鹿兒島","JP"], KIJ:["新潟","JP"], TAK:["高松","JP"], OKJ:["岡山","JP"],
  MYJ:["松山（愛媛）","JP"], ISG:["石垣島","JP"], UKB:["神戶","JP"], KMQ:["小松","JP"], HKD:["函館","JP"], AOJ:["青森","JP"],
  IBR:["茨城","JP"], SHI:["宮古島","JP"], FSZ:["靜岡","JP"], TOY:["富山","JP"], AKJ:["旭川","JP"], NGS:["長崎","JP"],
  OIT:["大分","JP"], YGJ:["米子","JP"], HSG:["佐賀","JP"], KCZ:["高知","JP"],
  SEL:["首爾","KR"], ICN:["首爾","KR"], GMP:["首爾","KR"], PUS:["釜山","KR"], CJU:["濟州島","KR"], TAE:["大邱","KR"],
  CJJ:["清州","KR"], MWX:["務安","KR"],
  BKK:["曼谷","TH"], DMK:["曼谷","TH"], CNX:["清邁","TH"], HKT:["普吉島","TH"], USM:["蘇美島","TH"], KBV:["喀比","TH"],
  UTP:["芭達雅","TH"], CEI:["清萊","TH"],
  SGN:["胡志明市","VN"], HAN:["河內","VN"], DAD:["峴港","VN"], CXR:["芽莊","VN"], PQC:["富國島","VN"], HPH:["海防","VN"],
  DLI:["大叻","VN"], VCA:["芹苴","VN"], HUI:["順化","VN"], VDO:["下龍灣","VN"],
  HKG:["香港","HK"],
  SHA:["上海","CN"], PVG:["上海","CN"], BJS:["北京","CN"], PEK:["北京","CN"], PKX:["北京","CN"],
  CAN:["廣州","CN"], SZX:["深圳","CN"], CTU:["成都","CN"], TFU:["成都","CN"], CKG:["重慶","CN"],
  XMN:["廈門","CN"], HGH:["杭州","CN"], NKG:["南京","CN"], TAO:["青島","CN"], WUH:["武漢","CN"],
  XIY:["西安","CN"], KMG:["昆明","CN"], DLC:["大連","CN"], FOC:["福州","CN"], TSN:["天津","CN"],
  CSX:["長沙","CN"], SYX:["三亞","CN"], CGO:["鄭州","CN"], SHE:["瀋陽","CN"], NGB:["寧波","CN"],
};
const ORIGIN_NAME = { TPE:"台北", TSA:"台北", KHH:"高雄", RMQ:"台中", TNN:"台南" };
const ORIGIN_GROUP = { TPE:"TPE", TSA:"TPE", KHH:"KHH", RMQ:"RMQ", TNN:"TNN" };

/* ====================================================================
   ② 聯盟連結：頁面上「每一個」出去的連結都只能由這個函式產生。
      不是 trip.com 的網址一律回傳 null（不顯示按鈕），避免客人被帶去別的網站。
   ==================================================================== */
function trackingSub1(){
  let src = "";
  try { src = new URLSearchParams(location.search).get("src") || ""; } catch(e) {}
  src = src.toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 30);
  return src ? `${AFFILIATE.sub1}_${src}` : AFFILIATE.sub1;
}
function affiliate(rawUrl){
  let u;
  try { u = new URL(rawUrl); } catch(e) { return null; }
  if (u.protocol !== "https:") return null;
  if (!(u.hostname === "trip.com" || u.hostname.endsWith(".trip.com"))) return null;
  u.searchParams.set("Allianceid", AFFILIATE.allianceId);
  u.searchParams.set("SID", AFFILIATE.sid);
  u.searchParams.set("trip_sub1", trackingSub1());
  u.searchParams.set("trip_sub3", AFFILIATE.sub3);
  return u.toString();
}
function flightUrl(f){
  const p = new URLSearchParams({
    dcity: f.o.toLowerCase(), acity: f.d.toLowerCase(), ddate: f.dep,
    triptype: f.ret ? "rt" : "ow", class: "ys", quantity: "1", childqty: "0", babyqty: "0",
    nonstoponly: f.direct ? "on" : "off", locale: "zh-TW", curr: "TWD",
  });
  if (f.ret) p.set("rdate", f.ret);
  return affiliate("https://tw.trip.com/flights/showfarefirst?" + p.toString());
}

/* ====================================================================
   ③ 小工具
   ==================================================================== */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const WD = ["週日","週一","週二","週三","週四","週五","週六"];
function todayTW(){ return new Date(Date.now() + 8*3600e3).toISOString().slice(0,10); }
function parseD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); }
function addDays(s, n){ const d = parseD(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diffDays(a, b){ return Math.round((parseD(b) - parseD(a)) / 86400e3); }
function wd(s){ return parseD(s).getUTCDay(); }
function fmtDate(s){ const d = parseD(s); return `${d.getUTCMonth()+1}月${d.getUTCDate()}日 ${WD[d.getUTCDay()]}`; }
function money(n){ return "NT$" + Math.round(n).toLocaleString("en-US"); }
function fmtTime(iso){
  const d = new Date(iso); if (isNaN(d)) return "";
  const t = new Date(d.getTime() + 8*3600e3);
  const p = (x) => String(x).padStart(2,"0");
  return `${t.getUTCMonth()+1}/${t.getUTCDate()} ${p(t.getUTCHours())}:${p(t.getUTCMinutes())}`;
}
function cityName(code){ return (CITIES[code] || [code])[0]; }
function countryOf(code){ return (CITIES[code] || [])[1] || null; }
function legStops(n){ return n === 0 ? "直飛" : (Number.isFinite(n) ? `轉機 ${n} 次` : ""); }
async function getJSON(url){
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* ====================================================================
   ④ 機票：資料整理
   ==================================================================== */
function normalize(r){
  const dep = String(r.departure_at || "").slice(0,10);
  const ret = r.return_at ? String(r.return_at).slice(0,10) : null;
  const o = ORIGIN_GROUP[r.origin] || ORIGIN_GROUP[r.origin_airport];
  const d = CITIES[r.destination] ? r.destination : (CITIES[r.destination_airport] ? r.destination_airport : null);
  const price = Number(r.price);
  if (!o || !d || !/^\d{4}-\d{2}-\d{2}$/.test(dep) || !(price > 0)) return null;
  if (ret && !/^\d{4}-\d{2}-\d{2}$/.test(ret)) return null;
  const tr = Number.isFinite(r.transfers) ? r.transfers : null;
  const rtr = ret ? (Number.isFinite(r.return_transfers) ? r.return_transfers : null) : 0;
  return {
    o, d, oAp: r.origin_airport || r.origin, dAp: r.destination_airport || r.destination,
    dep, ret, price, tr, rtr, direct: tr === 0 && rtr === 0, country: countryOf(d),
    airline: String(r.airline || "").toUpperCase(),
  };
}
function holidayOf(f){
  for (const h of HOLIDAYS){
    const depOk = f.dep >= addDays(h.start,-1) && f.dep <= addDays(h.end,-1);
    const retOk = !f.ret || (f.ret >= addDays(h.start,1) && f.ret <= addDays(h.end,1));
    if (depOk && retOk) return h;
  }
  return null;
}
function isWeekend(f){
  if (!f.ret) return [5,6].includes(wd(f.dep));
  const n = diffDays(f.dep, f.ret);
  return [4,5,6].includes(wd(f.dep)) && [0,1].includes(wd(f.ret)) && n >= 1 && n <= 4;
}

const state = {
  tab: "flights", mode: "all", type: "rt", origin: "", month: null, country: "", filter: "cheap",
  shown: CONFIG.pageSize, flights: [], updatedAt: null,
  hotels: [], hotelsUpdated: null, hCountry: "",
};
const FILTERS = [
  { v:"cheap", t:"最便宜" }, { v:"direct", t:"直飛" }, { v:"weekend", t:"週末" }, { v:"holiday", t:"連假" },
];

function monthKeys(){
  const t = todayTW(); const [y,m] = t.split("-").map(Number); const out = [];
  for (let i=0; i<CONFIG.monthsAhead; i++){ const d = new Date(Date.UTC(y, m-1+i, 1)); out.push(d.toISOString().slice(0,7)); }
  return out;
}

// 依目前條件篩選（不含「月份」），讓月份按鈕能顯示各月最低價
function baseFiltered(){
  const fsc = state.mode === "fsc";
  const countries = fsc ? FSC_COUNTRIES : MAIN_COUNTRIES;
  return state.flights.filter(f =>
    countries.includes(f.country) &&
    (!fsc || FSC_AIRLINES[f.airline]) &&
    (state.type === "rt" ? !!f.ret : !f.ret) &&
    (!state.origin || f.o === state.origin) &&
    (!state.country || f.country === state.country) &&
    (state.filter !== "direct" || f.direct) &&
    (state.filter !== "weekend" || isWeekend(f)) &&
    (state.filter !== "holiday" || holidayOf(f))
  );
}
// 同一條航線（出發地＋目的地）只留最便宜的一組日期
function cheapestPerRoute(list){
  const best = new Map();
  for (const f of list){
    const k = f.o + "-" + f.d;
    const cur = best.get(k);
    if (!cur || f.price < cur.price || (f.price === cur.price && f.dep < cur.dep)) best.set(k, f);
  }
  return [...best.values()].sort((a,b) => a.price - b.price || a.dep.localeCompare(b.dep));
}

/* ====================================================================
   ⑤ 機票：畫面
   ==================================================================== */
const ICON_OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M5.5 15.5 3 11l2-.5 2.5 2 4-1.5L8 5l2.5-.5 6 6 4-1.3a1.6 1.6 0 0 1 1 3L6.5 16.5z"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M18.5 15.5 21 11l-2-.5-2.5 2-4-1.5L16 5l-2.5-.5-6 6-4-1.3a1.6 1.6 0 0 0-1 3l15 4.3z"/></svg>';

function flightCard(f){
  const url = flightUrl(f);
  if (!url) return "";
  const hol = holidayOf(f);
  const tags = [];
  if (hol) tags.push(`<span class="tag hol">${esc(hol.name)}</span>`);
  if (isWeekend(f)) tags.push('<span class="tag">週末出發</span>');
  const days = f.ret ? `${diffDays(f.dep, f.ret) + 1} 日遊` : "單程";
  const back = f.ret ? `
      <div class="leg">${ICON_BACK}
        <div><div class="d">${esc(fmtDate(f.ret))}</div><div class="r">${esc(f.dAp)} 飛往 ${esc(f.oAp)}</div></div>
        <div class="x ${f.rtr === 0 ? "" : "stop"}">${esc(legStops(f.rtr))}</div>
      </div>` : "";
  return `
  <article class="card">
    <div class="body">
      <div class="dest"><span class="name">${esc(ORIGIN_NAME[f.o])} → ${esc(cityName(f.d))}</span><span class="from">${esc([FSC_AIRLINES[f.airline], COUNTRIES[f.country]].filter(Boolean).join("・"))}</span></div>
      <div class="leg">${ICON_OUT}
        <div><div class="d">${esc(fmtDate(f.dep))}</div><div class="r">${esc(f.oAp)} 飛往 ${esc(f.dAp)}</div></div>
        <div class="x ${f.tr === 0 ? "" : "stop"}">${esc(legStops(f.tr))}</div>
      </div>${back}
      <div class="bottom">
        <div class="tags">${tags.join("")}</div>
        <div class="price"><div class="l">預估最低只要</div><div class="v">${money(f.price)}</div><div class="n">${days}</div></div>
      </div>
    </div>
    <a class="go" href="${esc(url)}" target="_blank" rel="noopener sponsored"><span>去 Trip.com 看這些日期</span> →</a>
  </article>`;
}

function renderMonths(){
  const today = todayTW();
  const base = baseFiltered().filter(f => f.dep > today);
  $("#months").innerHTML = monthKeys().map(k => {
    const [y,m] = k.split("-");
    const inMonth = base.filter(f => f.dep.startsWith(k));
    const min = inMonth.length ? Math.min(...inMonth.map(f => f.price)) : null;
    return `<button class="month" aria-pressed="${k === state.month}" data-v="${k}">
      <div class="m">${Number(m)}月</div><div class="y">${y}</div><div class="p">${min ? money(min) + " 起" : "—"}</div></button>`;
  }).join("");
}
function renderChips(){
  const cs = state.mode === "fsc" ? FSC_COUNTRIES : MAIN_COUNTRIES;
  $("#countries").innerHTML = [["", "全部地區"], ...cs.map(c => [c, COUNTRIES[c]])].map(([v,t]) =>
    `<button class="chip" aria-pressed="${v === state.country}" data-v="${v}">${t}</button>`).join("");
  $("#filters").innerHTML = FILTERS.map(x =>
    `<button class="chip" aria-pressed="${x.v === state.filter}" data-v="${x.v}">${x.t}</button>`).join("");
}
function renderFlights(){
  renderMonths(); renderChips();
  const [y,m] = state.month.split("-");
  const fsc = state.mode === "fsc";
  const where = state.country ? COUNTRIES[state.country] : (fsc ? "日韓泰越・大陸港" : "日韓泰越");
  $("#fTitle").textContent = fsc ? `傳統航空飛往${where}的超值航班` : `飛往${where}的超值航班`;
  $("#fSub").textContent = `${Number(m)}月期間預估最低價格（${state.type === "rt" ? "來回" : "單程"}・1 位成人・含稅）`;

  const hols = HOLIDAYS.filter(h => h.start.startsWith(state.month) || h.end.startsWith(state.month));
  const hint = $("#holidayHint");
  if (hols.length){
    hint.classList.remove("hidden");
    hint.textContent = "本月連假：" + hols.map(h => `${h.name} ${h.start.slice(5).replace("-","/")}–${h.end.slice(5).replace("-","/")}`).join("、");
  } else hint.classList.add("hidden");

  const today = todayTW();
  const list = cheapestPerRoute(baseFiltered().filter(f => f.dep.startsWith(state.month) && f.dep > today));
  const box = $("#flightList");
  if (!state.flights.length){
    box.innerHTML = `<div class="empty">暫時抓不到價格，請稍後再試。<br/><a class="btn" href="${esc(affiliate("https://tw.trip.com/flights/"))}" target="_blank" rel="noopener sponsored">直接去 Trip.com 看機票</a></div>`;
  } else if (!list.length){
    box.innerHTML = `<div class="empty">這個條件下目前沒有低價票，換個月份或篩選看看 👀</div>`;
  } else {
    box.innerHTML = list.slice(0, state.shown).map(flightCard).join("");
  }
  $("#count").textContent = list.length ? `共 ${list.length} 條航線` : "";
  $("#moreBtn").classList.toggle("hidden", list.length <= state.shown);
}

/* ====================================================================
   ⑥ Adam 今日精選（picks.json）
   ==================================================================== */
async function loadPicks(){
  let j; try { j = await getJSON(CONFIG.picksUrl); } catch(e) { return; }
  const today = todayTW();
  const items = (Array.isArray(j?.items) ? j.items : []).filter(p =>
    p && /^\d{4}-\d{2}-\d{2}$/.test(p.departDate || "") && p.departDate > today && Number(p.price) > 0 &&
    ORIGIN_GROUP[p.origin] && CITIES[p.destination]);
  if (!items.length) return;
  const html = items.map(p => {
    const f = { o: ORIGIN_GROUP[p.origin], d: p.destination, dep: p.departDate, ret: p.returnDate || null, direct: !!p.direct };
    const url = flightUrl(f); if (!url) return "";
    const days = f.ret ? `${diffDays(f.dep, f.ret) + 1} 日遊` : "單程";
    return `
    <article class="card pick">
      <div class="body">
        <span class="badge">⭐ Adam 精選</span>
        <div class="dest" style="margin-top:10px"><span class="name">${esc(ORIGIN_NAME[f.o])} → ${esc(cityName(f.d))}</span><span class="from">${f.direct ? "直飛" : ""}</span></div>
        <div class="leg">${ICON_OUT}<div><div class="d">${esc(fmtDate(f.dep))}</div></div><div></div></div>
        ${f.ret ? `<div class="leg">${ICON_BACK}<div><div class="d">${esc(fmtDate(f.ret))}</div></div><div></div></div>` : ""}
        <div class="bottom">
          <div>${p.note ? `<div class="memo">${esc(p.note)}</div>` : ""}${p.checkedAt ? `<div class="checked">✓ ${esc(fmtTime(p.checkedAt))} 已在 Trip.com 核對</div>` : ""}</div>
          <div class="price"><div class="l">${f.ret ? "來回" : "單程"}</div><div class="v">${money(p.price)}</div><div class="n">${days}</div></div>
        </div>
      </div>
      <a class="go" href="${esc(url)}" target="_blank" rel="noopener sponsored"><span>去 Trip.com 訂這張</span> →</a>
    </article>`;
  }).join("");
  if (!html.trim()) return;
  $("#pickList").innerHTML = html;
  $("#picks").classList.remove("hidden");
}

/* ====================================================================
   ⑦ 酒店（hotels.json）
   ==================================================================== */
function hotelCard(h){
  const url = affiliate(h.url);
  if (!url) return "";
  const nights = (h.checkin && h.checkout) ? diffDays(h.checkin, h.checkout) : null;
  const when = (h.checkin && h.checkout) ? `${fmtDate(h.checkin)} 入住・${nights} 晚` : "";
  return `
  <article class="card hotel">
    <div class="body">
      <div class="dest"><span class="from">${esc(h.city || "")}${h.country && COUNTRIES[h.country] ? "・" + esc(COUNTRIES[h.country]) : ""}</span></div>
      <div class="name">${esc(h.name)}</div>
      <div class="area">${esc(h.area || "")}</div>
      <div class="bottom" style="margin-top:12px">
        <div>${Number(h.rating) ? `<span class="score">${esc(Number(h.rating).toFixed(1))}</span>` : ""}${when ? `<div class="area" style="margin-top:6px">${esc(when)}</div>` : ""}
          ${h.note ? `<div class="memo" style="font-size:14px;margin-top:6px;color:#374151">${esc(h.note)}</div>` : ""}</div>
        <div class="price"><div class="l">每晚含稅約</div><div class="v">${money(h.pricePerNight)}</div></div>
      </div>
    </div>
    <a class="go" href="${esc(url)}" target="_blank" rel="noopener sponsored"><span>去 Trip.com 看這間</span> →</a>
  </article>`;
}
function renderHotels(){
  $("#hCountries").innerHTML = [["", "全部國家"], ...Object.entries(COUNTRIES)].map(([v,t]) =>
    `<button class="chip" aria-pressed="${v === state.hCountry}" data-v="${v}">${t}</button>`).join("");
  const list = state.hotels.filter(h => !state.hCountry || h.country === state.hCountry);
  $("#hUpdated").textContent = state.hotelsUpdated ? `更新於 ${fmtTime(state.hotelsUpdated)}` : "";
  $("#hCount").textContent = list.length ? `共 ${list.length} 間` : "";
  $("#hotelList").innerHTML = list.length ? list.map(hotelCard).join("") :
    `<div class="empty">酒店精選整理中，很快上線 🛠️<br/><a class="btn" href="${esc(affiliate("https://tw.trip.com/hotels/"))}" target="_blank" rel="noopener sponsored">先去 Trip.com 看酒店</a></div>`;
}
async function loadHotels(){
  try {
    const j = await getJSON(CONFIG.hotelsUrl);
    const today = todayTW();
    state.hotels = (Array.isArray(j?.items) ? j.items : [])
      .filter(h => h && h.name && Number(h.pricePerNight) > 0 && Number(h.rating) >= 8 && affiliate(h.url) && (!h.checkin || h.checkin > today))
      .sort((a,b) => a.pricePerNight - b.pricePerNight);
    state.hotelsUpdated = j?.updated_at || null;
  } catch(e) { state.hotels = []; }
  renderHotels();
}

/* ====================================================================
   ⑧ 讀取機票資料
   ==================================================================== */
async function loadFlights(){
  const fscP = CONFIG.fscUrl ? getJSON(CONFIG.fscUrl).catch(() => null) : Promise.resolve(null);
  let fscRows = null;
  for (const url of CONFIG.dataUrls.filter(Boolean)){
    try {
      const j = await getJSON(url);
      if (fscRows === null) fscRows = ((await fscP) || {}).rows || [];
      const raw = [].concat(j.rows || [], j.data || [], j.air || [], fscRows);
      const seen = new Set(); const list = [];
      for (const r of raw){
        const f = normalize(r); if (!f) continue;
        const k = [f.o, f.d, f.dep, f.ret, f.price, f.tr, f.airline].join("|");
        if (seen.has(k)) continue; seen.add(k); list.push(f);
      }
      if (list.length){ state.flights = list; state.updatedAt = j.updated_at || null; break; }
    } catch(e) { /* 換下一個來源 */ }
  }
  $("#updated").textContent = state.flights.length
    ? `預估價・更新於 ${state.updatedAt ? fmtTime(state.updatedAt) : "今天"}` : "";
  state.month = bestMonth();
  renderFlights();
}
// 預設選「有票、而且最便宜」的月份
function bestMonth(){
  const keys = monthKeys(); const today = todayTW();
  const base = baseFiltered().filter(f => f.dep > today);
  let best = keys[0], bestPrice = Infinity;
  for (const k of keys){
    const ps = base.filter(f => f.dep.startsWith(k)).map(f => f.price);
    if (ps.length && Math.min(...ps) < bestPrice){ bestPrice = Math.min(...ps); best = k; }
  }
  return best;
}

/* ====================================================================
   ⑨ 互動
   ==================================================================== */
function resetPage(){ state.shown = CONFIG.pageSize; }
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  $("#flights").classList.toggle("hidden", state.tab === "hotels");
  $("#hotels").classList.toggle("hidden", state.tab !== "hotels");
  const fsc = state.tab === "fsc";
  $("#scopeText").textContent = fsc ? "台灣出發 → 日韓泰越・中國大陸・香港" : "台灣出發 → 日本・韓國・泰國・越南";
  $("#scopeSub").textContent = fsc ? "華航・長榮・星宇・國泰等傳統航空" : "任何日期・1 位成人・每天自動更新";
  if (state.tab !== "hotels"){
    const mode = fsc ? "fsc" : "all";
    if (mode !== state.mode){
      state.mode = mode; state.country = ""; resetPage();
      $("#picks").dataset.mode = mode;
      $("#picks").classList.toggle("off", fsc);
      if (state.flights.length) state.month = bestMonth();
      renderFlights();
    }
  }
});
$("#tripType").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.type = b.dataset.v; resetPage();
  $("#tripType").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderFlights();
});
$("#origin").addEventListener("change", e => { state.origin = e.target.value; resetPage(); renderFlights(); });
$("#months").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.month = b.dataset.v; resetPage(); renderFlights(); });
$("#countries").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.country = b.dataset.v; resetPage(); renderFlights(); });
$("#filters").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.filter = b.dataset.v; resetPage(); renderFlights(); });
$("#moreBtn").addEventListener("click", () => { state.shown += CONFIG.pageSize; renderFlights(); });
$("#hCountries").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.hCountry = b.dataset.v; renderHotels(); });

state.month = monthKeys()[0];
renderChips(); renderMonths();
loadFlights(); loadPicks(); loadHotels();
</script>
</body>
</html>
